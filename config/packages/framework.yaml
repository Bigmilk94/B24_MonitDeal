framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    handle_all_throwables: true
    php_errors:
        log: true
    router:
        utf8: true
    session:
        # The app runs inside a Bitrix24 iframe (a cross-site context from
        # the browser's point of view), so the session cookie needs
        # SameSite=None + Secure or browsers will silently drop it.
        cookie_secure: true
        cookie_samesite: none
        cookie_httponly: true
        # PHP's default session.save_path is sometimes unwritable on locked-
        # down shared hosting (e.g. open_basedir excludes it), causing a
        # hard-to-diagnose 500 the moment a session is actually started —
        # which for this app is exactly the Bitrix24 install/open handshake.
        # Store sessions inside our own already-writable var/ instead.
        save_path: '%kernel.project_dir%/var/sessions'
