parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            # App\Support\View renders plain-PHP templates itself — no Twig
            # involved. It just needs to know where templates/ lives.
            $templatesDir: '%kernel.project_dir%/templates'
            # App\Bitrix24\PortalRepository's single JSON "database" file —
            # no DB engine to install on the hosting.
            $storageFile: '%kernel.project_dir%/var/storage/portals.json'
            # Credentials from the Bitrix24 "local application" registration
            # (Zasoby deweloperskie → Inne → Aplikacja lokalna). Set in
            # .env.local — never commit real values.
            $bitrix24ClientId: '%env(BITRIX24_CLIENT_ID)%'
            $bitrix24ClientSecret: '%env(BITRIX24_CLIENT_SECRET)%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Domain/'
            - '../src/Support/helpers.php'

    # Single composition point for the CRM adapter. PortalAwareCrmService
    # picks Bitrix24CrmService when the current request belongs to an
    # installed portal (see CurrentPortalResolver), and falls back to the
    # demo MockCrmService otherwise — every controller and the rest of the
    # app depend only on the CrmServiceInterface, never on either concretely.
    App\Service\Crm\CrmServiceInterface: '@App\Service\Crm\PortalAwareCrmService'

    # MockCrmService needs "now" at construction time (it seeds the demo
    # data generator once per request); a tiny static factory lets us pull
    # that from the standard PSR-20 clock instead of wiring a raw
    # DateTimeImmutable through the container.
    App\Service\Crm\MockCrmService:
        factory: ['App\Service\Crm\MockCrmServiceFactory', 'create']
